<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prinde Refren — ghici piesa românească</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171426;
    --panel: #221d38;
    --panel-2: #2b2444;
    --gold: #e7a93c;
    --gold-dim: #b98a34;
    --clay: #c6483a;
    --green: #6fab6c;
    --text: #f5f1e8;
    --text-muted: #a79cc0;
    --line: rgba(245,241,232,0.10);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(231,169,60,0.10), transparent 60%),
      radial-gradient(900px 700px at 100% 10%, rgba(198,72,58,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:22px;
    animation: riseIn 0.5s ease both;
  }
  .logo{
    font-family:'Instrument Serif', serif;
    font-size:28px;
    font-style:italic;
    color:var(--gold);
    letter-spacing:0.3px;
    white-space:nowrap;
  }
  .stats{
    text-align:right;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.5;
  }
  .stats b{
    color:var(--text); font-size:16px; font-weight:600;
    display:inline-block;
    transition: transform 0.25s ease;
  }
  .stats b.pulse{ animation: scorePulse 0.5s ease; }
  @keyframes scorePulse{
    0%{ transform:scale(1); color:var(--text); }
    35%{ transform:scale(1.35); color:var(--green); }
    100%{ transform:scale(1); color:var(--text); }
  }

  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px 24px;
    position:relative;
    overflow:hidden;
    animation: riseIn 0.55s ease 0.08s both;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(231,169,60,0.06), transparent 40%);
    pointer-events:none;
  }

  /* --- vinyl --- */
  .stage-area{
    display:flex; align-items:center; justify-content:center;
    gap:26px;
    margin-bottom:22px;
  }
  .vinyl-holder{ position:relative; width:132px; height:132px; flex:none; }
  .vinyl{
    width:132px; height:132px; border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, #0f0d1a 0 2px, #1a1729 2px 4px);
    border:1px solid rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    animation: spin 4.5s linear infinite;
    animation-play-state: paused;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .vinyl.spinning{ animation-play-state: running; }
  .vinyl .label{
    width:46px; height:46px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
  }
  .vinyl .label::after{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--bg);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .tonearm{
    position:absolute;
    top:-6px; right:-4px;
    width:54px; height:54px;
    transform-origin: 88% 12%;
    transform: rotate(-32deg);
    transition: transform 0.35s cubic-bezier(.34,1.4,.64,1);
    pointer-events:none;
  }
  .tonearm.down{ transform: rotate(-6deg); }
  .tonearm::before{
    content:"";
    position:absolute; top:8px; right:8px;
    width:5px; height:38px; border-radius:3px;
    background: linear-gradient(var(--gold-dim), #7a5c22);
    transform-origin: top center;
  }
  .tonearm::after{
    content:"";
    position:absolute; top:0; right:2px;
    width:14px; height:14px; border-radius:50%;
    background: var(--gold-dim);
    border:2px solid var(--bg);
  }

  .play-col{ flex:1; min-width:0; }
  .play-btn{
    display:flex; align-items:center; gap:10px;
    background:var(--gold);
    color:#221a0c;
    border:none; border-radius:999px;
    padding:12px 20px;
    font-family:'Work Sans', sans-serif;
    font-weight:600; font-size:15px;
    cursor:pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .play-btn:hover{ transform: translateY(-1px); background:#f0b752; }
  .play-btn:active{ transform: translateY(0); }
  .play-btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .play-btn svg{ width:16px; height:16px; flex:none; }
  .stage-note{
    margin-top:10px; font-size:12.5px; color:var(--text-muted);
  }
  .stage-note b{ color:var(--gold); font-weight:600; }

  /* --- weighted progress bar --- */
  .track-bar{
    display:flex; height:10px; border-radius:6px; overflow:hidden;
    background:#120f1e;
    margin-bottom:8px;
    border:1px solid var(--line);
  }
  .seg{
    height:100%;
    background: rgba(245,241,232,0.06);
    border-right:1px solid var(--bg);
    position:relative;
    transition: background 0.3s ease;
  }
  .seg:last-child{ border-right:none; }
  .seg.done{ background: rgba(231,169,60,0.35); }
  .seg.active{ background: var(--gold); }
  .seg-labels{
    display:flex; margin-bottom:22px;
  }
  .seg-labels span{
    font-size:11px; color:var(--text-muted); text-align:center;
  }

  /* --- search / guess --- */
  .guess-row{ position:relative; margin-bottom:14px; }
  .search-input{
    width:100%;
    background:#120f1e;
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 16px;
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    outline:none;
  }
  .search-input:focus{ border-color: var(--gold-dim); }
  .search-input:disabled{ opacity:0.5; }
  .suggestions{
    position:absolute; left:0; right:0; top:calc(100% + 6px);
    background:#1c1830;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    z-index:5;
    max-height:260px; overflow-y:auto;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .suggestion{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .suggestion:last-child{ border-bottom:none; }
  .suggestion:hover{ background:rgba(231,169,60,0.10); }
  .suggestion img{ width:32px; height:32px; border-radius:6px; flex:none; object-fit:cover; background:#333; }
  .suggestion .meta{ min-width:0; }
  .suggestion .t{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .suggestion .a{ font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .action-row{ display:flex; gap:10px; }
  .btn{
    flex:1;
    border:none; border-radius:12px;
    padding:13px 14px;
    font-family:'Work Sans', sans-serif;
    font-weight:600; font-size:14.5px;
    cursor:pointer;
    transition: transform 0.12s ease, filter 0.15s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--gold); color:#221a0c; }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ghost{
    background:transparent; color:var(--text-muted);
    border:1px solid var(--line);
  }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-muted); }

  /* --- feedback --- */
  .feedback{
    margin-top:16px; padding:14px 16px;
    border-radius:12px;
    font-size:14px;
    display:none;
  }
  .feedback.show{ display:flex; gap:12px; align-items:center; animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn{
    from{ opacity:0; transform: scale(0.92) translateY(4px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }
  .feedback.correct{ background:rgba(111,171,108,0.15); border:1px solid rgba(111,171,108,0.4); }
  .feedback.wrong{ background:rgba(198,72,58,0.12); border:1px solid rgba(198,72,58,0.35); }
  .feedback img{ width:44px; height:44px; border-radius:8px; object-fit:cover; flex:none; }
  .feedback .fmeta b{ display:block; font-size:14.5px; }
  .feedback .fmeta span{ font-size:12.5px; color:var(--text-muted); }
  .shake{ animation: shake 0.35s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  .next-row{ margin-top:14px; display:none; }
  .next-row.show{ display:block; }

  .status{
    text-align:center; padding:50px 10px; color:var(--text-muted);
  }
  .status .spin-icon{
    width:34px; height:34px; margin:0 auto 14px;
    border:3px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; animation: spin 0.9s linear infinite;
  }
  .status button{
    margin-top:14px;
  }

  footer{
    text-align:center; margin-top:22px; font-size:12px; color:var(--text-muted);
    line-height:1.6;
  }
  footer a{ color:var(--gold-dim); }

  @media (max-width:420px){
    .stage-area{ gap:16px; }
    .vinyl, .vinyl-holder{ width:104px; height:104px; }
    .vinyl .label{ width:36px; height:36px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Prinde Refren</div>
    <div class="stats">
      <div>Scor <b id="scoreVal">0</b></div>
      <div id="roundVal">Runda 1</div>
    </div>
  </header>

  <div class="card" id="card">
    <div class="status" id="loadingStatus">
      <div class="spin-icon"></div>
      Se adună piese românești…
    </div>

    <div id="game" style="display:none;">
      <div class="stage-area">
        <div class="vinyl-holder">
          <div class="vinyl" id="vinyl"><div class="label"></div></div>
          <div class="tonearm" id="tonearm"></div>
        </div>
        <div class="play-col">
          <button class="play-btn" id="playBtn" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span id="playBtnLabel">Se încarcă…</span>
          </button>
          <div class="stage-note">Etapă <b id="stageLabel">0.1s</b> · valorează <b id="stagePoints">1000</b> puncte</div>
        </div>
      </div>

      <div class="track-bar" id="trackBar"></div>
      <div class="seg-labels" id="segLabels"></div>

      <div class="guess-row">
        <input class="search-input" id="searchInput" placeholder="Scrie titlul piesei…" autocomplete="off">
        <div class="suggestions" id="suggestions" style="display:none;"></div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="guessBtn" disabled>Ghicește</button>
        <button class="btn btn-ghost" id="skipBtn">Sari peste</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="next-row" id="nextRow">
        <button class="btn btn-primary" id="nextBtn" style="width:100%;">Următoarea piesă →</button>
      </div>
    </div>
  </div>

  <footer>
    Melodiile și fragmentele audio provin din catalogul public Apple/iTunes.<br>
    Titlurile, artiștii și înregistrările rămân proprietatea deținătorilor de drepturi.
  </footer>
</div>

<audio id="audio" preload="none"></audio>

<script>
const ARTISTS = [
  // pop / mainstream
  "Holograf","Loredana","Delia","Smiley","Antonia","Inna","Alexandra Stan","Andra",
  "Andreea Bălan","Alina Eremia","Raluka","Sore","Nicole Cherry","JO","Bella Santiago",
  "Anda Adam","Lidia Buble","Ioana Ignat","Theo Rose","Alexandra Ungureanu",
  // rock / alternative
  "Voltaj","Direcția 5","Vama Veche","Taxi","Vunk","Proconsul","Bosquito","Compact",
  "Iris","Phoenix","Celelalte Cuvinte","Cargo","Tudor Chirilă","Sarmalele Reci",
  // trap / hip-hop / R&B
  "Carla's Dreams","Alex Velea","Puya","Guess Who","Nane","Killa Fonic","The Motans",
  "Grasu XXL","Connect-R","Deepcentral","BUG Mafia","Cheloo","Şatra Benz","Amuly",
  "Emaa","Kamelia","NOSFE","Ruby","Cabron",
  // dance / electro
  "O-Zone","Akcent","3 Sud Est","Morandi","Play & Win","DJ Project","Dan Bălan",
  "Mandinga","Blondy","David Deejay","Sianna","Krisstain","What's Up",
  // muzica populara / folk / etno
  "Subcarpați","Zdob și Zdub","Ștefan Hrușcă","Simplu","Georgiana Lobonț",
  "Ștefan Bănică","Feli","Irina Rimes"
];

const STAGES = [0.1, 0.5, 2, 8, 15];
const STAGE_POINTS = [1000, 800, 600, 400, 200];

let pool = [];
let usedIds = new Set();
let current = null;
let stageIndex = 0;
let score = 0;
let round = 1;
let guessLocked = false;
let clipTimer = null;
let selectedSuggestion = null;

const $ = (id) => document.getElementById(id);

function normalize(str){
  return str
    .toLowerCase()
    .replace(/ă/g,'a').replace(/â/g,'a').replace(/î/g,'i')
    .replace(/ș/g,'s').replace(/ş/g,'s').replace(/ț/g,'t').replace(/ţ/g,'t')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .trim();
}

async function fetchArtist(name){
  // cerem propriului server (server.js) sa aduca piesele, nu iTunes direct,
  // ca sa evitam blocajele CORS/sandbox ale cererilor facute din browser.
  const url = "/api/search?artist=" + encodeURIComponent(name);
  try{
    const res = await fetch(url);
    if(!res.ok) return [];
    return await res.json();
  } catch(e){
    return [];
  }
}

async function buildPool(){
  const shuffledArtists = [...ARTISTS].sort(() => Math.random() - 0.5).slice(0, 24);
  const results = await Promise.allSettled(shuffledArtists.map(fetchArtist));
  const seen = new Set();
  results.forEach(r => {
    if(r.status === 'fulfilled'){
      r.value.forEach(track => {
        if(!seen.has(track.id)){
          seen.add(track.id);
          pool.push(track);
        }
      });
    }
  });
}

function renderStageBar(){
  const total = STAGES.reduce((a,b)=>a+b,0);
  const minPct = 8; // fiecare etapa are minim atat spatiu, ca sa incapa eticheta
  const remaining = 100 - (minPct * STAGES.length);
  const widths = STAGES.map(s => minPct + (s/total) * remaining);

  const bar = $('trackBar');
  const labels = $('segLabels');
  bar.innerHTML = '';
  labels.innerHTML = '';
  STAGES.forEach((s, i) => {
    const pct = widths[i].toFixed(2);
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.width = pct + '%';
    seg.dataset.i = i;
    bar.appendChild(seg);

    const lab = document.createElement('span');
    lab.style.width = pct + '%';
    lab.textContent = s + 's';
    labels.appendChild(lab);
  });
  updateStageBar();
}

function updateStageBar(){
  document.querySelectorAll('.seg').forEach(seg => {
    const i = parseInt(seg.dataset.i, 10);
    seg.classList.toggle('done', i < stageIndex);
    seg.classList.toggle('active', i === stageIndex);
  });
  $('stageLabel').textContent = STAGES[stageIndex] + 's';
  $('stagePoints').textContent = STAGE_POINTS[stageIndex];
}

function pickSong(){
  if(usedIds.size >= pool.length) usedIds.clear();
  let candidate;
  do{
    candidate = pool[Math.floor(Math.random()*pool.length)];
  } while(usedIds.has(candidate.id) && usedIds.size < pool.length);
  usedIds.add(candidate.id);
  return candidate;
}

function armAudioForRound(track){
  const audio = $('audio');
  audio.pause();
  audio.preload = 'auto';
  audio.src = track.preview;
  $('playBtn').disabled = true;
  $('playBtnLabel').textContent = 'Se încarcă…';
  audio.load();

  const markReady = () => {
    $('playBtn').disabled = false;
    $('playBtnLabel').textContent = 'Redă clipul';
  };
  audio.addEventListener('canplaythrough', markReady, { once: true });
  // plasa de siguranta: unele browsere nu trimit mereu canplaythrough
  setTimeout(markReady, 3500);
}

function startRound(){
  current = pickSong();
  stageIndex = 0;
  guessLocked = false;
  selectedSuggestion = null;
  $('vinyl').classList.remove('spinning');
  $('tonearm').classList.remove('down');
  $('searchInput').value = '';
  $('searchInput').disabled = false;
  $('guessBtn').disabled = true;
  $('skipBtn').disabled = false;
  $('suggestions').style.display = 'none';
  const fb = $('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
  $('nextRow').classList.remove('show');
  $('roundVal').textContent = 'Runda ' + round;
  updateStageBar();
  armAudioForRound(current);
}

function playClip(){
  const audio = $('audio');
  clearTimeout(clipTimer);
  audio.currentTime = 0;
  $('vinyl').classList.add('spinning');
  $('tonearm').classList.add('down');

  const onPlaying = () => {
    clipTimer = setTimeout(() => {
      audio.pause();
      $('vinyl').classList.remove('spinning');
      $('tonearm').classList.remove('down');
    }, STAGES[stageIndex] * 1000);
  };
  audio.addEventListener('playing', onPlaying, { once: true });

  const playPromise = audio.play();
  if(playPromise){ playPromise.catch(()=>{}); }
}

function showSuggestions(query){
  const box = $('suggestions');
  if(!query){ box.style.display='none'; box.innerHTML=''; return; }
  const q = normalize(query);
  const matches = pool.filter(t =>
    normalize(t.title).includes(q) || normalize(t.artist).includes(q)
  ).slice(0, 6);
  if(matches.length === 0){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = '';
  matches.forEach(t => {
    const row = document.createElement('div');
    row.className = 'suggestion';
    row.innerHTML = `<img src="${t.artwork}" alt=""><div class="meta"><div class="t">${escapeHtml(t.title)}</div><div class="a">${escapeHtml(t.artist)}</div></div>`;
    row.addEventListener('click', () => {
      selectedSuggestion = t;
      $('searchInput').value = t.title + ' — ' + t.artist;
      box.style.display = 'none';
      $('guessBtn').disabled = false;
    });
    box.appendChild(row);
  });
  box.style.display = 'block';
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function revealAnswer(correct){
  clearTimeout(clipTimer);
  $('audio').pause();
  $('vinyl').classList.remove('spinning');
  $('tonearm').classList.remove('down');
  guessLocked = true;
  $('searchInput').disabled = true;
  $('guessBtn').disabled = true;
  $('skipBtn').disabled = true;
  $('playBtn').disabled = true;

  const fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
  const pointsEarned = correct ? STAGE_POINTS[stageIndex] : 0;
  if(correct){
    score += pointsEarned;
    const scoreEl = $('scoreVal');
    scoreEl.textContent = score;
    scoreEl.classList.remove('pulse');
    void scoreEl.offsetWidth; // reporneste animatia daca era deja aplicata
    scoreEl.classList.add('pulse');
  }

  fb.innerHTML = `
    <img src="${current.artwork}" alt="">
    <div class="fmeta">
      <b>${escapeHtml(current.title)}</b>
      <span>${escapeHtml(current.artist)} ${correct ? '· +' + pointsEarned + ' puncte' : '· răspuns corect'}</span>
    </div>
  `;
  $('nextRow').classList.add('show');
}

function handleGuess(){
  if(guessLocked || !selectedSuggestion) return;
  if(selectedSuggestion.id === current.id){
    revealAnswer(true);
  } else {
    stageIndex++;
    if(stageIndex >= STAGES.length){
      revealAnswer(false);
    } else {
      updateStageBar();
      $('searchInput').value = '';
      selectedSuggestion = null;
      $('guessBtn').disabled = true;
      const card = $('card');
      card.classList.add('shake');
      setTimeout(()=>card.classList.remove('shake'), 350);
    }
  }
}

function handleSkip(){
  if(guessLocked) return;
  stageIndex++;
  if(stageIndex >= STAGES.length){
    revealAnswer(false);
  } else {
    updateStageBar();
    $('searchInput').value = '';
    selectedSuggestion = null;
    $('guessBtn').disabled = true;
  }
}

function init(){
  $('playBtn').addEventListener('click', playClip);
  $('guessBtn').addEventListener('click', handleGuess);
  $('skipBtn').addEventListener('click', handleSkip);
  $('nextBtn').addEventListener('click', () => { round++; startRound(); });
  $('searchInput').addEventListener('input', (e) => {
    selectedSuggestion = null;
    $('guessBtn').disabled = true;
    showSuggestions(e.target.value);
  });
  $('searchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !$('guessBtn').disabled) handleGuess();
  });
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.guess-row')) $('suggestions').style.display = 'none';
  });

  renderStageBar();

  buildPool().then(() => {
    if(pool.length < 10){
      $('loadingStatus').innerHTML = `
        Nu am putut aduna destule piese chiar acum.<br>
        Verifică dacă serverul (server.js) rulează.<br>
        <button class="btn btn-primary" onclick="location.reload()">Încearcă din nou</button>
      `;
      return;
    }
    $('loadingStatus').style.display = 'none';
    $('game').style.display = 'block';
    startRound();
  });
}

init();
</script>
</body>
</html>
